[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfnrec"
version = "0.1.0"
description = "DFN Reconstruction from Tunnel Face Traces"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
]

[project.optional-dependencies]
geo = ["shapely"]
cli = ["click"]
dev = ["pytest", "pytest-cov"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dfnrec*"]
